
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | NOVA STORE</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- ANNOUNCEMENT BAR -->
    <div class="announcement-bar">
        Complimentary shipping on orders over $150
    </div>

    <!-- HEADER -->
    <header class="main-header">
        <a href="index.html" class="logo">NOVA.</a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="cart.html" class="cart-link">Cart (0)</a>
        </nav>
    </header>

    <!-- CHECKOUT PAGE -->
    <main class="checkout-page">

        <div class="checkout-heading">
            <h1>Checkout</h1>
            <p>Complete your order below.</p>
        </div>

        <div class="checkout-container">

            <!-- CUSTOMER INFORMATION -->
            <section class="checkout-form-section">

                <h2>Contact Information</h2>

                <form id="checkout-form">

                    <div class="form-group">
                        <label for="customer-name">Full Name</label>
                        <input
                            type="text"
                            id="customer-name"
                            placeholder="Your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="customer-email">Email Address</label>
                        <input
                            type="email"
                            id="customer-email"
                            placeholder="Your email address"
                            required
                        >
                    </div>

                    <h2>Shipping Address</h2>

                    <div class="form-group">
                        <label for="customer-address">Street Address</label>
                        <input
                            type="text"
                            id="customer-address"
                            placeholder="Street address"
                            required
                        >
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="customer-city">City</label>
                            <input
                                type="text"
                                id="customer-city"
                                placeholder="City"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="customer-country">Country</label>
                            <input
                                type="text"
                                id="customer-country"
                                placeholder="Country"
                                required
                            >
                        </div>

                    </div>

                    <h2>Delivery Method</h2>

                    <div class="delivery-option">
                        <label>
                            <input
                                type="radio"
                                name="delivery"
                                value="standard"
                                checked
                            >
                            Standard Delivery
                            <span>Free</span>
                        </label>
                    </div>

                    <div class="delivery-option">
                        <label>
                            <input
                                type="radio"
                                name="delivery"
                                value="express"
                            >
                            Express Delivery
                            <span>$10.00</span>
                        </label>
                    </div>

                    <button type="submit" class="checkout-btn">
                        Place Order
                    </button>

                </form>

            </section>

            <!-- ORDER SUMMARY -->
            <aside class="checkout-summary">

                <h2>Your Order</h2>

                <div id="checkout-items">
                    Loading your order...
                </div>

                <div id="checkout-totals"></div>

            </aside>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-content">
            <h2>NOVA.</h2>
            <p>Timeless style. Modern elegance.</p>
        </div>

        <div class="footer-bottom">
            <p>© 2026 NOVA STORE. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/products.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/checkout.js" defer></script>

</body>
</html>
