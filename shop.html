
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | NOVA STORE</title>

    <meta name="description" content="Explore the NOVA STORE collection of timeless fashion and accessories.">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/responsive.css">

    <script src="js/products.js" defer></script>
    <script src="js/shop.js" defer></script>
</head>

<body>

    <div class="announcement-bar">
        Complimentary shipping on orders over $150
    </div>

    <header class="header">
        <a href="index.html" class="logo">NOVA<span>.</span></a>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
        </nav>

        <div class="header-actions">
            <a href="cart.html" class="cart-link">
                Cart (<span id="cart-count">0</span>)
            </a>
        </div>
    </header>

    <main>

        <section class="shop-intro">
            <p class="eyebrow">THE NOVA COLLECTION</p>
            <h1>Discover Your Style</h1>
            <p>Timeless essentials, thoughtfully selected.</p>
        </section>

        <section class="shop-container">

            <div class="shop-toolbar">

                <div class="shop-results">
                    Showing all products
                </div>

                <div class="shop-controls">
                    <input
                        type="search"
                        id="product-search"
                        placeholder="Search products..."
                    >

                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="women">Women</option>
                        <option value="men">Men</option>
                        <option value="accessories">Accessories</option>
                    </select>

                    <select id="sort-products">
                        <option value="default">Featured</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                        <option value="name">Name: A to Z</option>
                    </select>
                </div>

            </div>

            <div class="shop-product-grid" id="shop-product-grid">
                <!-- Products will be displayed here using JavaScript -->
            </div>

        </section>

    </main>

    <footer class="footer">
        <a href="index.html" class="logo">NOVA<span>.</span></a>
        <p>Modern elegance. Timeless identity.</p>
        <p>&copy; 2026 NOVA STORE. All rights reserved.</p>
    </footer>

</body>
</html>
